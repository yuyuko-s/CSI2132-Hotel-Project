{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}

{% block content %}

<form method="POST">
  <br />
  <h3 alignn="center">Create New Customer</h3>
  <div class="form-group">
    <label for="full_name">Full Name</label>
    <input
      type="text"
      class="form-control"
      id="full_name"
      name="full_name"
      placeholder="Enter Full Name"
    />
  </div>

  <div class="form-group">
    <label for="address">Address</label>
    <input
      type="address"
      class="form-control"
      id="address"
      name="address"
      placeholder="Enter Address"
    />
  </div>

  <br />

  <button type="submit" class="btn btn-primary">Submit</button>

</form>

{% endblock %}
